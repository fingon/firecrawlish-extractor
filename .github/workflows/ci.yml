name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          python-version: "3.15.1"
          version: "0.13.5"
      - name: Install locked development environment
        run: uv sync --locked --dev
      - name: Run prek
        run: uv run --locked prek run --all-files
      - name: Run Makefile lint target
        run: make lint
      - name: Run Makefile test target
        run: make test
      - name: Run integration tests
        run: make integration
      - name: Run Makefile build target
        run: make build
      - name: Build container without publishing
        run: make image CONTAINER_RUNTIME=docker IMAGE_NAME=firecrawlish-extractor:ci
      - name: Smoke-test local container image
        run: make smoke CONTAINER_RUNTIME=docker IMAGE_NAME=firecrawlish-extractor:ci
