[project]
name = "firecrawlish-extractor"
version = "0.1.0"
description = "A small Firecrawl-compatible extraction and search service."
readme = "README.md"
requires-python = ">=3.15,<3.16"
dependencies = [
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "structlog==26.1.0",
    "trafilatura==2.3.1",
    "uvicorn==0.54.0",
]

[project.scripts]
firecrawlish-extractor = "firecrawlish_extractor.__main__:main"

[dependency-groups]
dev = [
    "firecrawl-py==4.54.0",
    "prek==0.5.7",
    "pytest==9.1.1",
    "ruff==0.17.2",
    "ty==0.0.92",
]

[build-system]
requires = ["uv_build==0.13.5"]
build-backend = "uv_build"

[tool.ruff]
line-length = 80

[tool.pytest.ini_options]
markers = ["integration: uses local servers or a container runtime"]
