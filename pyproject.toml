[project]
name = "firecrawlish-extractor"
version = "0.1.0"
description = "A small Firecrawl-compatible extraction and search service."
readme = "README.md"
requires-python = ">=3.15,<3.16"
dependencies = [
    "fastapi==0.165.0",
    "httpx==0.28.1",
    "pydantic==2.14.4",
    "pydantic-settings==2.16.3",
    "structlog==26.1.0",
    "trafilatura==2.4.0",
    "uvicorn==0.54.0",
]

[project.scripts]
firecrawlish-extractor = "firecrawlish_extractor.__main__:main"

[dependency-groups]
dev = [
    "firecrawl-py==4.57.0",
    "prek==0.5.11",
    "pytest==9.2.0",
    "ruff==0.17.6",
    "ty==0.0.108",
]

[build-system]
requires = ["uv_build==0.13.9"]
build-backend = "uv_build"

[tool.ruff]
line-length = 80

[tool.pytest.ini_options]
markers = ["integration: uses local servers or a container runtime"]
